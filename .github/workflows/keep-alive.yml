name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'   # cada 3 días, 12:00 UTC (9:00 AM Argentina)
  workflow_dispatch:          # permite correrlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://vzjnbnetxntnxbrufnsb.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
